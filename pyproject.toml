[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "subtitle-sync"
version = "0.1.0"
description = "Lightweight manual subtitle playback controller for Windows desktop."
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.8",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
subtitle-sync = "subtitle_sync.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
